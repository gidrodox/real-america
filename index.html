<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real America 2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: road-atlas page. Itinerary column on the left, pannable map on the right; stacks on phones. */
  --bg:#eef1ef; --panel:#ffffff; --ink:#14232b; --muted:#566871; --line:#d5ddd9;
  --land:#e4e9df; --landline:#b4c0b6; --water:#cfe0e8;
  --route:#0f5fa8; --flight:#7a4fb5; --accent:#d99a00; --accent-ink:#221a00;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1719; --panel:#162124; --ink:#e6edf0; --muted:#a1b2b8; --line:#2b3a3e;
    --land:#223033; --landline:#3b5054; --water:#0d1517;
    --route:#62aef2; --flight:#b99cf2; --accent:#f2c14a; --accent-ink:#221a00;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1719; --panel:#162124; --ink:#e6edf0; --muted:#a1b2b8; --line:#2b3a3e;
  --land:#223033; --landline:#3b5054; --water:#0d1517;
  --route:#62aef2; --flight:#b99cf2; --accent:#f2c14a; --accent-ink:#221a00;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:19.5px;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(480px,1fr) 1fr;height:100%}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
h1{font-family:var(--font-display);font-weight:700;font-size:45px;line-height:1.05;margin:0 0 4px;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 12px;font-size:18.5px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0;padding:0;list-style:none;font-size:17px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
#list{flex:1;min-height:0;overflow-y:auto;padding:6px 0 28px;scroll-behavior:smooth}
.stop{padding:16px 22px 16px 19px;border-left:3px solid transparent;cursor:pointer}
.stop:hover{background:color-mix(in srgb,var(--route) 5%,transparent)}
.stop.active{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.stop-top{display:flex;align-items:center;gap:12px}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--route);color:#fff;font-family:var(--font-display);font-weight:700;font-size:23.5px;display:flex;align-items:center;justify-content:center}
.stop.active .num{background:var(--accent);color:var(--accent-ink)}
h2{font-family:var(--font-display);font-weight:700;font-size:33px;line-height:1.1;margin:0;letter-spacing:.01em}
.wx{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}.wxi{font-size:31.5px;line-height:1}.wxt{font-family:var(--font-display);font-weight:700;font-size:26.5px;font-variant-numeric:tabular-nums}
.when{font-size:17px;color:var(--muted);margin:2px 0 0;font-variant-numeric:tabular-nums}
.body{margin:10px 0 0 42px}
.body p{margin:0 0 8px}
.body ul{margin:0 0 8px;padding-left:18px}
.body li{margin:0 0 4px}
.label{font-size:16px;font-weight:600;color:var(--muted);margin:10px 0 3px}
.meta{font-size:17px;color:var(--muted)}
.show{margin-top:6px;font:inherit;font-size:17px;font-weight:500;color:var(--route);background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.show:hover{border-color:var(--route)}
.show:focus-visible,.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.leg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 22px 0 33px;padding:9px 0 9px 22px;border-left:2px dashed var(--line);font-size:17px;color:var(--muted)}
.leg.fly{border-left-color:var(--flight)}
.leg b{color:var(--ink);font-weight:600}
.shield{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1;letter-spacing:.02em;padding:3px 6px;border:1.5px solid var(--ink);border-radius:4px;color:var(--ink);white-space:nowrap}
.open{margin:14px 22px 0;padding:14px 16px;border:1px solid var(--line);border-radius:8px}
.open h3{font-family:var(--font-display);font-weight:700;font-size:26.5px;margin:0 0 6px}
.open ul{margin:0;padding-left:18px}
.open li{margin:0 0 5px}
.mapwrap{position:relative;min-height:0;background:var(--water);overflow:hidden}
svg#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
svg#map.drag{cursor:grabbing}
.state{fill:var(--land);stroke:var(--landline);stroke-width:1;vector-effect:non-scaling-stroke}
.abbr{font-family:var(--font-display);font-weight:600;fill:var(--landline);text-anchor:middle;pointer-events:none}
.road{fill:none;stroke:var(--route);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.road-case{fill:none;stroke:var(--panel);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.air{fill:none;stroke:var(--flight);stroke-width:2.5;stroke-dasharray:7 6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.marker{cursor:pointer;outline:none}
.marker:focus,.marker:focus-visible{outline:none}
.marker:focus-visible circle{stroke:var(--accent);stroke-width:4}
.marker circle{fill:var(--route);stroke:var(--panel);stroke-width:2.5}
.marker.active circle{fill:var(--accent)}
.marker .n{font-family:var(--font-display);font-weight:700;font-size:18.5px;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.marker.active .n{fill:var(--accent-ink)}
.marker .name{font-family:var(--font-body);font-weight:600;font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
.minor circle{fill:var(--panel);stroke:var(--route);stroke-width:2.5}
.minor .name{font-weight:500;font-size:14px;fill:var(--muted)}
.zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 20.5px/1 var(--font-body);cursor:pointer}
.zoom button.wide{width:auto;padding:0 10px;font-size:15px}
.key{position:absolute;left:14px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14.5px;color:var(--muted)}
.key span{display:flex;align-items:center;gap:6px}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:44% 1fr}
  .mapwrap{grid-row:1}
  .side{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  .head{padding:14px 16px 10px}
  h1{font-size:30px}
  .stop{padding:14px 16px 14px 13px}
  .leg{margin:0 16px 0 27px}
  .open{margin:14px 16px 0}
}
@media (prefers-reduced-motion:reduce){#list{scroll-behavior:auto}}
.sname{font-family:var(--font-display);font-weight:700;font-size:33px;line-height:1.1;margin:0;letter-spacing:.01em}
.photo{display:block;width:calc(100% + 42px);max-width:none;margin-left:-42px!important;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin:0 0 10px;background:var(--line)}
.tabs{display:flex;gap:6px;margin:12px 0 0}
.tab{flex:1;min-width:0;font:600 19.5px/1 var(--font-body);padding:10px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--route);border-color:var(--route);color:#fff}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intro{padding:14px 22px 6px}
.intro h2{font-size:31.5px;margin:0 0 4px}
.diff{margin:12px 0 4px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:8px}
.diff h3{font-family:var(--font-display);font-weight:700;font-size:25.5px;margin:0 0 6px;letter-spacing:.01em}
.diff ul{margin:0;padding-left:18px}
.diff li{margin:0 0 4px}
.diff p{margin:8px 0 0;font-size:18px;color:var(--muted)}
@media (max-width:820px){.intro{padding:12px 16px 4px}}
.ttl{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;margin:0 0 10px}.ttl h2{margin:0}
.scores{display:flex;flex-wrap:wrap;gap:6px 16px;flex:0 1 auto;max-width:100%}.sc{display:flex;flex-direction:column;align-items:flex-start;gap:1px}.scl{font-size:14.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stars{position:relative;display:inline-block;font-size:22.5px;line-height:1;letter-spacing:1px;color:var(--line)}.stars span{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--accent)}
@media (max-width:520px){.tabs{gap:3px}.tab{font-size:13px;padding:9px 1px;letter-spacing:-.01em}}

.rankbtn{float:right;margin:4px 0 0 12px;font:600 18.5px/1 var(--font-body);padding:10px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.rankbtn:hover{filter:brightness(1.05)}
#rankDlg{border:1px solid var(--line);border-radius:14px;padding:0;max-width:440px;width:calc(100% - 32px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
#rankDlg::backdrop{background:rgba(10,20,25,.55)}
#rankDlg form{padding:20px 22px 18px;margin:0}
#rankDlg h2{font-family:var(--font-display);font-size:34.5px;margin:0 0 4px}
#rankDlg .hint{margin:0 0 14px;color:var(--muted);font-size:18.5px}
#rankDlg label.nm{display:block;font-size:17px;font-weight:600;color:var(--muted);margin-bottom:14px}
#rkName{display:block;width:100%;margin-top:6px;font:19.5px var(--font-body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#rkList{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
#rkList li{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative}
#rkList li:focus-visible{outline:2px solid var(--route);outline-offset:2px}
#rkList li.drag{cursor:grabbing;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.25);background:var(--panel);transition:none}
#rkList li.anim{transition:transform .15s}
#rkList .pos{flex:none;width:26px;height:26px;border-radius:50%;background:var(--route);color:#fff;display:grid;place-items:center;font:700 18.5px var(--font-display)}
#rkList li:first-child .pos{background:var(--accent);color:var(--accent-ink)}
#rkList .rt{flex:1;min-width:0}
#rkList .rt b{display:block;font-size:19.5px}
#rkList .rt span{display:block;font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rkList .grip{flex:none;color:var(--muted);font-size:26.5px;line-height:1;letter-spacing:-2px}
#rkMsg{min-height:20px;margin:0 0 10px;font-size:18.5px}
#rkMsg.err{color:#c0392b}
#rankDlg .acts{display:flex;gap:8px;justify-content:flex-end}
#rankDlg .acts button{font:600 19.5px var(--font-body);padding:10px 16px;border-radius:8px;cursor:pointer}
#rkCancel{border:1px solid var(--line);background:var(--panel);color:var(--ink)}
#rkSend{border:1px solid var(--route);background:var(--route);color:#fff}
#rkSend:disabled{opacity:.6;cursor:default}
#rkRes{margin:0 0 14px}
#rkRes h3{font-family:var(--font-display);font-size:26.5px;margin:4px 0 8px}
#rkRes .tot{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
#rkRes .tot li{display:grid;grid-template-columns:26px 92px 1fr auto;align-items:center;gap:10px;font-size:18.5px}
#rkRes .tot .bar{height:10px;border-radius:5px;background:var(--route)}
#rkRes .tot li:first-child .bar{background:var(--accent)}
#rkRes .tot .pts{color:var(--muted);font-variant-numeric:tabular-nums;font-size:17px}
#rkRes .who{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:17px}
#rkRes .who b{display:inline-block;min-width:80px}
#rkRes .who span{color:var(--muted)}
#rkSee{background:none;border:0;padding:0;color:var(--route);font:600 18.5px var(--font-body);cursor:pointer;text-decoration:underline}

/* photo-background cards (set BG_PHOTOS=false in the script to go back to photos above the text) */
.stop.bg{position:relative;color:#fff;background-size:cover;background-position:center;aspect-ratio:16/9;display:flex;flex-direction:column;text-shadow:0 0 2px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.7)}
.stop.bg:hover{filter:none}
.stop.bg.active{box-shadow:inset 0 0 0 3px var(--accent)}
.stop.bg .sname{color:#fff}
.stop.bg .when{color:rgba(255,255,255,.88)}
.stop.bg .wxt{color:#fff}

.stop.bg .body p,.stop.bg .body li{color:#fff}
.stop.bg .show{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.55);color:#fff;text-shadow:none;backdrop-filter:blur(2px)}
.stop.bg .show:hover{background:rgba(255,255,255,.28)}

.stop.bg{font-size:17.5px;text-shadow:none}
.stop.bg .stop-top{background:rgba(12,16,20,.65);border-radius:10px;padding:8px 12px 8px 8px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.stop.bg .sname{font-size:29.5px}
.stop.bg .when{font-size:15.5px}
.stop.bg .wxt{font-size:24px}
.stop.bg .wxi{font-size:28px}
.stop.bg .body{margin-top:auto;margin-left:0;padding:12px 14px 10px;background:rgba(12,16,20,.65);border-radius:10px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.stop.bg .body ul{margin-bottom:6px}
.stop.bg .show{font-size:15.5px}
.stop.bg .stop-top,.stop.bg .body{margin-bottom:0}
.stop.bg{gap:12px}

.stop.bg .stop-top{background:none;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none;text-shadow:0 0 2px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.7)}
.stop.bg .body{align-self:flex-start;max-width:100%;padding:7px 11px 6px;line-height:1.32;border-radius:8px}
.stop.bg .body p{margin:0 0 3px}
.stop.bg .body ul{margin:0;padding-left:16px}
.stop.bg .body li{margin:0 0 1px}

.ttlbox{display:flex;align-items:center;gap:12px;min-width:0}
.stop.bg .ttlbox{background:rgba(12,16,20,.65);border-radius:8px;padding:6px 12px 6px 8px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);text-shadow:none}
.stop.bg .body{font-size:15.75px}

.leg{margin:0;padding:9px 22px 9px 55px;border-left:0;background:#1a252b;color:rgba(255,255,255,.72)}
.leg b{color:#fff}
@media (max-width:820px){.leg{margin:0;padding:8px 16px 8px 43px}}

/* dark top sections */
#list{padding-top:0}
.head .tabs{margin-top:14px;clear:both}
.head{background:#1a252b;color:#fff;border-bottom:0}
.head h1{color:#fff;margin:6px 0 0}
.tab{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.85)}
.tab:hover{background:rgba(255,255,255,.14)}
.tab[aria-selected="true"]{background:var(--route);border-color:var(--route);color:#fff}
.intro{background:#1a252b;color:#fff;padding-bottom:16px}
.intro h2{color:#fff}
.scl{color:rgba(255,255,255,.7)}
.stars{color:rgba(255,255,255,.22)}
.diff{background:rgba(255,255,255,.06);border-color:color-mix(in srgb,var(--accent) 65%,transparent);color:#fff}
.diff h3{color:var(--accent)}
.rankbtn{font-size:26px;padding:16px 28px;border-radius:12px;margin:0 0 0 16px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
@media (max-width:820px){.rankbtn{font-size:19px;padding:12px 16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <header class="head">
      <button class="rankbtn" id="rankBtn" type="button">Rank the routes</button>
      <h1>Real America, 2028</h1>
      <div class="tabs" role="tablist" aria-label="Choose a version">
        <button class="tab" role="tab" id="t-mar" data-opt="mar" aria-selected="true" aria-controls="list">March</button>
        <button class="tab" role="tab" id="t-may" data-opt="may" aria-selected="false" aria-controls="list">May</button>
        <button class="tab" role="tab" id="t-sep" data-opt="sep" aria-selected="false" aria-controls="list">September</button>
        <button class="tab" role="tab" id="t-nov" data-opt="nov" aria-selected="false" aria-controls="list">November</button>
        <button class="tab" role="tab" id="t-val" data-opt="val" aria-selected="false" aria-controls="list">Valera</button>
      </div>
    </header>
    <div id="list" tabindex="0" role="tabpanel" aria-label="Itinerary, stop by stop"></div>
  </aside>

  <div class="mapwrap">
    <svg id="map" role="group" aria-label="Map of the route"></svg>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">−</button>
      <button type="button" id="zfit" class="wide">Whole route</button>
    </div>
    <div class="key">
      <span><svg width="26" height="8" aria-hidden="true"><line x1="2" y1="4" x2="24" y2="4" stroke="var(--route)" stroke-width="4" stroke-linecap="round"/></svg>Drive</span>
      <span><svg width="26" height="8" aria-hidden="true"><line x1="2" y1="4" x2="24" y2="4" stroke="var(--flight)" stroke-width="2.5" stroke-dasharray="6 5"/></svg>Flight</span>
    </div>
  </div>
</div>

<dialog id="rankDlg" aria-labelledby="rkTitle">
  <form method="dialog" id="rkForm">
    <h2 id="rkTitle">Rank the routes</h2>
    <p class="hint">Drag the routes into your order. Number 1 is your favourite.</p>
    <label class="nm">Your name (needed to send)<input id="rkName" maxlength="60" autocomplete="name" required></label>
    <ol id="rkList"></ol>
    <div id="rkRes" hidden></div>
    <p id="rkMsg" role="status" aria-live="polite"></p>
    <div class="acts"><button type="button" id="rkSee" hidden>See everyone’s rankings</button><span style="flex:1"></span><button type="button" id="rkCancel">Close</button><button type="submit" id="rkSend">Send my ranking</button></div>
  </form>

function rkVoted(){try{return localStorage.getItem('rkVoted')==='1'}catch(_){return false}}
async function rkResults(){
 rkRes.hidden=false;rkRes.textContent='Loading everyone’s rankings…';
 try{
  const j=await (await fetch(VOTE_URL)).json();
  if(!j.votes){rkRes.textContent='Everyone’s rankings will show here once the sheet is updated.';return}
  const routes=j.routes||Object.values(RK_NAMES),pts={};routes.forEach(r=>pts[r]=0);
  j.votes.forEach(v=>v.order.forEach((r,i)=>{if(r in pts)pts[r]+=routes.length-i}));
  const max=Math.max(1,...Object.values(pts)),sorted=routes.slice().sort((a,b)=>pts[b]-pts[a]);
  rkRes.innerHTML='';
  const h=document.createElement('h3');h.textContent='Group ranking ('+j.votes.length+(j.votes.length===1?' vote)':' votes)');rkRes.appendChild(h);
  const ol=document.createElement('ol');ol.className='tot';
  sorted.forEach((r,i)=>{const li=document.createElement('li');li.innerHTML='<span class="pos"></span><b></b><span class="bar"></span><span class="pts"></span>';
   li.querySelector('.pos').textContent=i+1;li.querySelector('b').textContent=r;li.querySelector('.bar').style.width=(pts[r]/max*100)+'%';li.querySelector('.pts').textContent=pts[r]+' pts';ol.appendChild(li)});
  rkRes.appendChild(ol);
  const h2=document.createElement('h3');h2.textContent='Everyone’s picks';rkRes.appendChild(h2);
  const ul=document.createElement('ul');ul.className='who';
  j.votes.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(v=>{const li=document.createElement('li');const b=document.createElement('b');b.textContent=v.name;const sp=document.createElement('span');sp.textContent=v.order.join(' › ');li.append(b,' ',sp);ul.appendChild(li)});
  rkRes.appendChild(ul);
 }catch(_){rkRes.textContent='Couldn’t load the rankings. Try again in a moment.'}
}
rkSee.addEventListener('click',()=>{rkSee.hidden=true;rkResults()});
</script>
</body>
</html>
